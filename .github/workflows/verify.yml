name: Verify
'on':
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven

      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -ntp clean verify

      - name: Verify on Linux
        if: runner.os != 'Windows'
        run: ./mvnw -B -ntp clean verify

      - name: Inspect packaged artifact
        run: python .github/scripts/verify_artifact.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coreai-${{ matrix.os }}
          path: target/coreai-*.jar
          if-no-files-found: error
          retention-days: 7
